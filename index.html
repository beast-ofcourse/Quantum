<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quantum</title>
    <script>
      (function () {
        try {
          var raw = localStorage.getItem("code-editor:ui");
          var theme = "dark";
          if (raw) {
            var parsed = JSON.parse(raw);
            theme = parsed && parsed.state && parsed.state.theme;
          }
          if (theme !== "light" && theme !== "dark" && theme !== "catppuccin-mocha") theme = "dark";
          if (theme === "dark") document.documentElement.classList.add("dark");
          if (theme === "catppuccin-mocha") { document.documentElement.classList.add("catppuccin-mocha"); theme = "dark"; }
          document.documentElement.style.colorScheme = theme;
        } catch (e) {
          document.documentElement.classList.add("dark");
          document.documentElement.style.colorScheme = "dark";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

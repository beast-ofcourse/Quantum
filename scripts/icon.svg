<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background -->
  <rect x="0" y="0" width="512" height="512" rx="96" fill="#0b0b1a"/>
  <rect x="2" y="2" width="508" height="508" rx="95" fill="none" stroke="#1e2940" stroke-width="4"/>

  <!-- Rungs (base pairs) - flat color for crisp rendering -->
  <g stroke="#f59e0b" stroke-width="18" stroke-linecap="round">
    <line x1="130" y1="88" x2="350" y2="88"/>
    <line x1="160" y1="140" x2="310" y2="140"/>
    <line x1="200" y1="190" x2="270" y2="190"/>
    <line x1="270" y1="240" x2="200" y2="240"/>
    <line x1="350" y1="290" x2="130" y2="290"/>
    <line x1="280" y1="340" x2="200" y2="340"/>
    <line x1="200" y1="390" x2="270" y2="390"/>
    <line x1="150" y1="435" x2="340" y2="435"/>
  </g>

  <!-- Strand 1 (left to right to left) - flat bold cyan -->
  <path d="M 115 50 C 115 155, 380 155, 380 256 C 380 357, 115 357, 115 462"
        fill="none" stroke="#06b6d4" stroke-width="26" stroke-linecap="round"/>

  <!-- Strand 2 (right to left to right) - flat bold teal -->
  <path d="M 397 50 C 397 155, 132 155, 132 256 C 132 357, 397 357, 397 462"
        fill="none" stroke="#14b8a6" stroke-width="26" stroke-linecap="round"/>
</svg>
